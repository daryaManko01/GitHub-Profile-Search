<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github User Finder</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            background-color: #010310;
            padding-top: 160px;
            font-family: Inter, sans-serif;
        }
        .h1 {
            color: #FFF;
            text-align: center;
            font-family: Inter;
            font-size: 56px;
            font-style: normal;
            margin: 0;
        }

        .h2 {
            color: #7A7676;
            text-align: center;
            font-family: Inter;
            font-size: 24px;
            font-style: normal;
            margin: 0;
        }

        .main_text {
            display: flex;
            flex-direction: column;
            gap: 7px;
            align-items: center;
            justify-content: center;
        }

        .input {
            color: white;
            font-family: Inter;
            font-size: 14px;
            font-style: normal;
            width: 380px;
            padding: 13px 16px;
            border-radius: 5px;
            border: 1px solid #202E41;
            background-color: #202E41;
        }

        .button {
            color: #FFF;
            text-align: center;
            font-family: Inter;
            font-size: 16px;
            padding: 12px 48px;
            background-color: #1451E8;
            border: 1px solid #202E41;
            border-radius: 5px;
            cursor: pointer;
        }

        .form {
            display: flex;
            flex-direction: row;
            gap: 13px;
            justify-content: center;
        }

        .first_block {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .text {
            color: #FFF;
            font-family: Inter;
            font-size: 16px;
            font-style: normal;
        }

        .text_description {
            color: #7A7676;
            font-family: Inter;
            font-size: 14px;
            font-style: normal;
        }

        .description {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .part_one {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .text_name {
            color: #FFF;
            font-family: Inter;
            font-size: 14px;
            font-style: normal;
        }

        .color {
            color: #7A7676;
        }

        .name_one {
            display: flex;
            flex-direction: row;
            gap: 5px;
            align-items: center;
        }

        .description_end {
            display: flex;
            flex-direction: row;
            gap: 15px;
        }

        .card {
            display: flex;
            gap: 22px;
            flex-direction: row;
            background-color: #0B192B;
            border: 1px solid #202E41;
            padding: 30px;
            width: fit-content;
            margin: 35px auto 0;
            border-radius: 5px;
            visibility: visible;
        }

        .text_down {
            margin-top: 35px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        @media (max-width: 768px) {
            body {
                padding-top: 80px;
            }
            .h1 {
                font-size: 38px;
            }
            .h2 {
                font-size: 18px;
            }
            .card {
                max-width: 100%;
            }
        }
        @media (max-width: 576px) {
            .h1 {
                font-size: 28px;
            }

            .h2 {
                font-size: 15px;
            }
            .form {
                flex-direction: column;
                align-items: center;
                width: 100%;
                max-width: 380px;
                margin: 0 auto;
            }

            .input {
                width: 100%;
            }

            .button {
                width: 100%;
            }

            .card {
                flex-direction: column;
                align-items: center;
                text-align: center;
                width: 100%;
                padding: 20px;
            }

            .name_one {
                justify-content: center;
            }

            .description_end {
                flex-direction: column;
                gap: 8px;
            }

            .text_down {
                margin-top: 25px;
                gap: 15px;
            }

            #bio br {
                display: none;
            }
        }


    </style>

</head>

<body>
    <header class="first_block">
        <div class="main_text">
            <h1 class="h1">Github User Finder</h1>
            <h2 class="h2">Search for GitHub users and view their profile</h2>
        </div>
        <form id="form" class="form">
            <input id="input_name" class="input" type="search" name="username" placeholder="Enter name">
            <button class="button" type="submit">Search</button>
        </form>
    </header>


    <main class="card">
        <aside>
            <img id="avatar_url" src="src/image.svg" alt="User avatar">
        </aside>
        <section>
            <div class="part_one">
                <div>
                    <span id="name_bio" class="text"><strong>Ethan Brooks</strong></span>
                </div>
                <div class="description">
                    <span id="login" class="text_description">@ethanbrooks</span>
                    <span id="bio" class="text_description">Frontend developer passionate about building clean<br>
                        and user-friendly web applications.
                    </span>
                </div>
            </div>
            <div class="text_down">
                <div class="description_end">
                    <div class="name_one">
                        <span class="text_name">Public Repos:</span>
                        <span id="repos" class="text_name color">8</span>
                    </div>
                    <div class="name_one">
                        <span class="text_name">Followers:</span>
                        <span id="followers" class="text_name color">2</span>
                    </div>
                    <div class="name_one">
                        <span class="text_name">Following:</span>
                        <span id="following" class="text_name color">15</span>
                    </div>
                </div>
                <div class="description_end">
                    <div class="name_one">
                        <span class="text_name">Location:</span>
                        <span id="location" class="text_name color">London</span>
                    </div>
                    <div class="name_one">
                        <span class="text_name">Company:</span>
                        <span id="coumpany" class="text_name color">Freelance</span>
                    </div>
                    <div class="name_one">
                        <span class="text_name">Blog:</span>
                        <span id="blog" class="text_name color">ethanbrooks.dev</span>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="index.js"></script>

</body>
